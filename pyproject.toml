[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code2paper-agent"
version = "0.1.0"
description = "Implementation-grounded code-to-paper method evidence schemas."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.scripts]
code2paper = "code2paper.main_cli:main"
code2paper-align = "code2paper.align_cli:main"
code2paper-author-review = "code2paper.author_review_cli:main"
code2paper-claim-ground = "code2paper.claim_grounder_cli:main"
code2paper-config-values = "code2paper.config_value_cli:main"
code2paper-fidelity = "code2paper.fidelity_cli:main"
code2paper-figure = "code2paper.figure_cli:main"
code2paper-ingest = "code2paper.cli:main"
code2paper-method-draft = "code2paper.method_draft_cli:main"
code2paper-method-evidence = "code2paper.method_evidence_cli:main"
code2paper-run = "code2paper.run_cli:main"
code2paper-agentic-run = "code2paper.cli.agentic_run:main"
code2paper-agentic-benchmark = "code2paper.cli.agentic_benchmark:main"
code2paper-agentic-benchmark-protocol = "code2paper.cli.agentic_benchmark_protocol:main"
code2paper-agentic-adversarial-campaign = "code2paper.cli.agentic_adversarial_campaign:main"

[project.optional-dependencies]
figure = [
  "CairoSVG>=2.7",
]
agentic = [
  "langgraph>=1.2.8,<1.3",
  "langchain-core>=1.4.9,<1.5",
  "langgraph-checkpoint-sqlite>=3.0,<4",
]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_llm: opt-in tests that call a configured live LLM endpoint",
]
