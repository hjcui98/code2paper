project_goal: "Train and evaluate a Transformer model for machine translation."
paper_method_goal: "Describe the implementation-grounded training pipeline and core Transformer components."
implementation_scope: "Current attention-is-all-you-need-pytorch codebase only."

# narrative/authoring control layer
