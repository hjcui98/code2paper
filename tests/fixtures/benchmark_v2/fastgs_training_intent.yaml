project_goal: "Describe only code-backed FastGS training mechanics."
paper_method_goal: "Prioritize training initialization, checkpoint restoration, rendering supervision, and the implemented loss."
implementation_scope: "Current FastGS code only; do not infer performance or causality."
priority_files:
  - "train.py"
  - "scene/gaussian_model.py"
ignore_files:
  - "submodules/**"
module_roles:
  - path: "train.py"
    symbol: "training"
    role: "training loop and supervision"
    importance: "core"
    is_novel: false
    notes: "Inspect checkpoint restoration and loss computation."
pipeline_steps:
  - name: "Training initialization"
    purpose: "Initialize Gaussian state and optionally restore a checkpoint."
    input: ["dataset", "optimization options", "optional checkpoint"]
    output: ["initialized training state"]
    related_files: ["train.py"]
    highlight_level: "main"
    omit_from_main_figure: false
  - name: "Rendering supervision"
    purpose: "Render a view and compute the implemented image loss."
    input: ["viewpoint", "Gaussian state"]
    output: ["loss for backward"]
    related_files: ["train.py"]
    highlight_level: "main"
    omit_from_main_figure: false
innovation_claims: []
potential_mismatches: []
